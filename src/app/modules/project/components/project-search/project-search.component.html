<div class="my-5 flex gap-4">
  <div class="flex-1">
    <label
      class="mb-2 block text-sm font-medium dark:text-white"
      for="filterName"
    >
      Cerca progetto
    </label>
    <input
      #filterName
      class="block w-full rounded-lg border border-gray-300 px-4 py-2.5 outline-orange-500 focus:border-orange-500 focus:ring-orange-500 disabled:pointer-events-none disabled:opacity-50 sm:py-3 sm:text-sm dark:border-neutral-700 dark:bg-neutral-900 dark:text-neutral-400 dark:placeholder-neutral-500 dark:focus:ring-neutral-600"
      name="filterName"
      type="text"
      (input)="name.set(filterName.value)"
    />
  </div>

  <div class="flex-1">
    <label
      class="mb-2 block text-sm font-medium dark:text-white"
      for="filterPriority"
    >
      Cerca priorità
    </label>
    <select
      #filterPriority
      class="block w-full appearance-none rounded-lg border border-gray-300 px-4 py-3 pe-9 text-sm outline-orange-500 focus:border-orange-500 focus:ring-orange-500 disabled:pointer-events-none disabled:opacity-50 dark:border-neutral-700 dark:bg-neutral-900 dark:text-neutral-400 dark:placeholder-neutral-500 dark:focus:ring-neutral-600"
      name="filterPriority"
      (input)="priority.set(filterPriority.value)"
    >
      <option></option>
      <option value="low">Low</option>
      <option value="medium">Medium</option>
      <option value="high">High</option>
    </select>
  </div>

  <div class="flex-1">
    <label
      class="mb-2 block text-sm font-medium dark:text-white"
      for="filterDone"
    >
      Cerca stato
    </label>
    <select
      #filterDone
      class="block w-full appearance-none rounded-lg border border-gray-300 px-4 py-3 pe-9 text-sm outline-orange-500 focus:border-orange-500 focus:ring-orange-500 disabled:pointer-events-none disabled:opacity-50 dark:border-neutral-700 dark:bg-neutral-900 dark:text-neutral-400 dark:placeholder-neutral-500 dark:focus:ring-neutral-600"
      name="filterDone"
      (input)="done.set(filterDone.value)"
    >
      <option></option>
      <option value="true">Done</option>
      <option value="false">In progress</option>
    </select>
  </div>
</div>
