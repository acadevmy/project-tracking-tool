<div class="flex flex-col">
  <div class="flex items-center justify-between">
    <h2 class="mb-2 text-xl font-bold text-gray-900">
      {{ title() }}
    </h2>

    <button
      class="inline-flex cursor-pointer items-center gap-x-2 rounded-lg border px-4 py-3 text-sm font-medium disabled:pointer-events-none disabled:opacity-50"
      type="button"
      [ngClass]="{
        'border-transparent bg-orange-500 text-white hover:bg-orange-600': button().type === 'solid',
        'border-gray-200 text-gray-500 hover:border-orange-500 hover:text-orange-500': button().type === 'outlined',
        'border-transparent text-orange-500 hover:text-orange-600': button().type === 'link'
      }"
      [routerLink]="button().link"
    >
      {{ button().label }}
    </button>
  </div>
  <hr class="mt-5" />
</div>
